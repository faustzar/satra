name: satra_mobile
description: "SATRA Mobile: Offline-first tortoise tracking, rescue, rehabilitation, and biometric shell monitoring."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  geolocator: ^12.0.0
  camera: ^0.10.5+9
  dio: ^5.5.0+1
  uuid: ^4.4.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
