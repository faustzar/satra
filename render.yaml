services:
  # SATRA FastAPI Backend Web Service
  - type: web
    name: satra-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt # Can be oregon, frankfurt, ohio, singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: satra-db
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: satra-db
    databaseName: satra
    user: satra_admin
    plan: free
    region: frankfurt
